
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sport Racing</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:white;font-family:Arial;text-align:center;overflow:hidden}
header{padding:12px;background:#172b3b;font-size:22px;font-weight:bold}
#stats{display:flex;justify-content:space-around;padding:10px;background:#20384a;font-size:14px}
canvas{display:block;width:100%;height:58vh;background:#333}
#controls{display:flex;justify-content:center;gap:12px;padding:12px;flex-wrap:wrap}
button{background:#1688db;color:white;border:0;border-radius:12px;padding:14px 20px;font-weight:bold;font-size:15px}
button:active{background:#07528a}
#message{padding:5px;font-size:14px;color:#ffd65b}
</style>
</head>
<body>
<header>🏁 SPORT RACING</header>
<div id="stats">
<span>🏆 Level <b id="level">1</b>/150</span>
<span>🪙 <b id="coins">0</b></span>
<span>⚡ <b id="speed">0</b> KM/H</span>
</div>
<canvas id="game"></canvas>
<div id="message">Avoid obstacles and collect coins!</div>
<div id="controls">
<button id="left">⬅ LEFT</button>
<button id="turbo">⚡ TURBO</button>
<button id="right">RIGHT ➡</button>
<button id="low">LOW MODE</button>
<button id="start">START / RESTART</button>
</div>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W,H,player=0,objects=[],coins=0,level=1,speed=0;
let running=false,frame=0,turbo=false,low=false;
let trophy=0,carColor="#00bfff";
function resize(){
 W=canvas.width=innerWidth*devicePixelRatio;
 H=canvas.height=innerHeight*.58*devicePixelRatio;
}
resize();addEventListener("resize",resize);
function text(t,x,y,size,color="white"){
 ctx.fillStyle=color;ctx.font="bold "+size+"px Arial";ctx.textAlign="center";ctx.fillText(t,x,y);
}
function road(){
 ctx.fillStyle="#23733c";ctx.fillRect(0,0,W,H);
 ctx.fillStyle="#444";ctx.beginPath();
 ctx.moveTo(W*.25,0);ctx.lineTo(W*.75,0);
 ctx.lineTo(W*.95,H);ctx.lineTo(W*.05,H);ctx.fill();
 ctx.strokeStyle="white";ctx.lineWidth=5;
 ctx.setLineDash([35,30]);ctx.beginPath();
 ctx.moveTo(W*.5,0);ctx.lineTo(W*.5,H);ctx.stroke();
 ctx.setLineDash([]);
}
function car(x,y,color){
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.roundRect(x- W*.055,y,W*.11,H*.13,12);
 ctx.fill();
 ctx.fillStyle="#9deaff";
 ctx.fillRect(x-W*.035,y+H*.025,W*.07,H*.035);
 ctx.fillStyle="#111";
 ctx.fillRect(x-W*.065,y+H*.025,W*.012,H*.035);
 ctx.fillRect(x+W*.053,y+H*.025,W*.012,H*.035);
}
function spawn(){
 let lane=Math.floor(Math.random()*3);
 let x=W*(.32+lane*.18);
 objects.push({x,y:-40,type:Math.random()<.32?"coin":"obstacle"});
}
function draw(){
 ctx.clearRect(0,0,W,H);road();
 if(Math.random()<.025)spawn();
 for(let o of objects){
  o.y+=speed*devicePixelRatio*.12;
  if(o.type==="coin"){
   ctx.fillStyle="#ffd700";ctx.beginPath();
   ctx.arc(o.x,o.y,12*devicePixelRatio,0,Math.PI*2);ctx.fill();
   text("C",o.x,o.y+5,13,"#754800");
  }else{
   ctx.fillStyle="#e33";ctx.fillRect(o.x-20,o.y,40,35);
   text("!",o.x,o.y+26,25);
  }
  if(o.y>H*.78&&o.y<H*.94&&Math.abs(o.x-W*(.5+player*.18))<W*.07){
   if(o.type==="coin"){coins+=10;o.y=H+100;document.getElementById("coins").textContent=coins;}
   else{running=false;document.getElementById("message").textContent="💥 Crash! Press START to try again.";}
  }
 }
 objects=objects.filter(o=>o.y<H+50);
 car(W*(.5+player*.18),H*.78,carColor);
 text("KM/H",W*.5,H*.12,17);
 ctx.beginPath();ctx.arc(W*.5,H*.24,H*.09,0,Math.PI*2);
 ctx.strokeStyle="#00bfff";ctx.lineWidth=8;ctx.stroke();
 text(speed,W*.5,H*.25,28);
 if(!running)text("PRESS START",W*.5,H*.5,28,"#ffd700");
}
function loop(){
 if(running){
  frame++;
  speed=low?35:turbo?180:100;
  if(frame%500===0&&level<150){
   level++;
   document.getElementById("level").textContent=level;
   coins+=50;
   document.getElementById("coins").textContent=coins;
  }
  if(level===150&&trophy===0){
   trophy=1;coins+=500;
   document.getElementById("message").textContent="🏆 CHAMPION! Level 150 completed! +500 coins";
  }
 }
 document.getElementById("speed").textContent=speed;
 draw();requestAnimationFrame(loop);
}
loop();
function move(d){if(running)player=Math.max(-1,Math.min(1,player+d));}
document.getElementById("left").onclick=()=>move(-1);
document.getElementById("right").onclick=()=>move(1);
document.getElementById("turbo").onclick=()=>turbo=!turbo;
document.getElementById("low").onclick=()=>low=!low;
document.getElementById("start").onclick=()=>{
 objects=[];frame=0;speed=0;player=0;running=true;
 document.getElementById("message").textContent="🏎️ Race started!";
};
addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")move(-1);
 if(e.key==="ArrowRight")move(1);
});
</script>
</body>
</html>
